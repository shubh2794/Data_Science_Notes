<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Data Science · Knowledge Graph</title>
<script src="vendor/d3.min.js"></script>
<style>
  :root{ --bg:#1a1a1d; --panel:#202024; --panel-2:#26262b; --ink:#dcddde; --muted:#999aa0; --accent:#a78bfa; --line:#33343a; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(ellipse at 50% 40%, #202024 0%, #161618 80%);
    color:var(--ink); overflow:hidden;}
  a{color:var(--accent);text-decoration:none;}
  #graph{position:fixed;inset:0;width:100vw;height:100vh;cursor:grab;}
  #graph:active{cursor:grabbing;}

  .topbar{position:fixed;top:0;left:0;right:0;padding:18px 24px;pointer-events:none;z-index:5;}
  .topbar h1{margin:0;font-size:20px;letter-spacing:-0.3px;font-weight:700;}
  .topbar h1 .accent{color:var(--accent);}
  .topbar p{margin:4px 0 0;font-size:12px;color:var(--muted);max-width:560px;}

  .searchwrap{position:fixed;top:18px;right:26px;z-index:6;display:flex;align-items:center;gap:6px;}
  #search-count{font-size:11px;color:#6b6c72;min-width:46px;text-align:right;}
  #search-clear{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:7px;width:30px;height:32px;cursor:pointer;display:none;}
  #search{background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:9px 13px;border-radius:8px;font-size:13px;width:200px;outline:none;}
  #search:focus{border-color:var(--accent);}
  #search-results{position:absolute;top:40px;right:0;width:min(280px,74vw);max-height:330px;overflow:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px;
    box-shadow:0 14px 36px rgba(0,0,0,.55);display:none;z-index:7;}
  #search-results.open{display:block;}
  .sr-row{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;cursor:pointer;}
  .sr-row.sel{background:rgba(255,255,255,.08);}
  .sr-dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .sr-title{font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sr-dom{margin-left:auto;font-size:10px;color:var(--muted);white-space:nowrap;flex:none;}

  /* Obsidian-style controls panel */
  .controls{position:fixed;left:18px;bottom:18px;z-index:6;background:rgba(28,28,32,.9);border:1px solid var(--line);
    border-radius:10px;padding:12px 14px;backdrop-filter:blur(10px);width:230px;font-size:12px;color:var(--muted);box-shadow:0 10px 30px rgba(0,0,0,.5);
    max-height:calc(100vh - 36px);overflow-y:auto;}
  .controls h4{margin:0 0 9px;font-size:10px;text-transform:uppercase;letter-spacing:1.3px;color:#6b6c72;font-weight:700;flex-shrink:0;}
  .ctrl-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:9px 0;min-height:20px;}
  .ctrl-row label{flex-shrink:0;}
  .ctrl-row input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:18px;margin:0;}
  .ctrl-row input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px;}
  .ctrl-row .ctrl-val{flex-shrink:0;width:30px;text-align:right;font-variant-numeric:tabular-nums;font-size:11px;color:#7c7d85;}
  .legtoggle{display:flex;flex-wrap:wrap;gap:5px;}
  .legtoggle button{display:flex;align-items:center;gap:5px;background:none;border:none;color:var(--muted);font:inherit;font-size:11px;cursor:pointer;padding:2px 5px;border-radius:6px;}
  .legtoggle button:hover{background:rgba(255,255,255,.06);color:var(--ink);}
  .legtoggle button .sw{width:8px;height:8px;border-radius:50%;}
  /* a selected domain is HIGHLIGHTED in the graph, never removed from it */
  .legtoggle button.on{background:rgba(255,255,255,.11);color:var(--ink);font-weight:600;}
  .legtoggle button.on .sw{box-shadow:0 0 0 2px rgba(255,255,255,.30);}

  /* collapsible sections in the bottom-left panel */
  .sechead{display:flex;align-items:center;gap:6px;width:100%;background:none;border:none;padding:0;margin:0 0 9px;
    font:inherit;font-size:10px;text-transform:uppercase;letter-spacing:1.3px;color:#6b6c72;font-weight:700;cursor:pointer;}
  .sechead:hover{color:var(--ink);}
  .sechead .caret{transition:transform .18s;font-size:9px;line-height:1;color:#6b6c72;}
  .sechead[aria-expanded="false"] .caret{transform:rotate(-90deg);}
  .sechead .tally{margin-left:auto;font-weight:600;letter-spacing:0;text-transform:none;font-size:10px;color:var(--accent);}
  .sechead[aria-expanded="true"] + .secbody{display:block;}
  .sechead[aria-expanded="false"] + .secbody{display:none;}
  .legsec{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;}
  #leg-clear{display:none;background:none;border:1px solid var(--line);color:var(--muted);font:inherit;font-size:10.5px;
    cursor:pointer;padding:2px 7px;border-radius:6px;margin-top:8px;}
  #leg-clear:hover{color:var(--ink);border-color:var(--accent);}
  #leg-clear.show{display:inline-block;}
  .minibtn{background:none;border:1px solid var(--line);color:var(--muted);font:inherit;font-size:10.5px;
    cursor:pointer;padding:3px 8px;border-radius:6px;}
  .minibtn:hover{color:var(--ink);border-color:var(--accent);}
  .ctrl-row select{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:11.5px;}
  .node.stub-faded{opacity:.28;}

  .detail{position:fixed;top:0;right:0;height:100vh;width:330px;z-index:8;background:rgba(26,26,29,.97);
    border-left:1px solid var(--line);backdrop-filter:blur(10px);padding:72px 24px 24px;
    transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);overflow-y:auto;}
  .detail.open{transform:translateX(0);}
  .detail .close{position:absolute;top:20px;right:20px;cursor:pointer;color:var(--muted);font-size:22px;line-height:1;}
  .detail .close:hover{color:var(--ink);}
  .detail .back{position:absolute;top:20px;left:24px;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;display:none;}
  .detail .back:hover{color:var(--accent);}
  .detail .kicker{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;font-weight:600;margin-bottom:6px;}
  .detail h2{margin:0 0 12px;font-size:22px;letter-spacing:-0.3px;}
  .detail p.desc{color:var(--muted);font-size:13.5px;line-height:1.62;margin:0 0 16px;}
  .detail .conn-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#6b6c72;margin:16px 0 8px;}
  .detail .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .detail .chip{font-size:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:4px 11px;color:var(--muted);cursor:pointer;}
  .detail .chip:hover{color:var(--ink);border-color:var(--accent);}
  .detail .opennotes{display:inline-block;margin-top:18px;background:var(--accent);color:#1a1320;font-weight:600;padding:10px 18px;border-radius:9px;font-size:13.5px;}
  .detail .opennotes:hover{filter:brightness(1.1);}
  .detail .soon{display:inline-block;margin-top:18px;color:#6b6c72;font-size:13px;font-style:italic;}

  .glink{}  /* base stroke colour + opacity set via attributes in JS; states below override */
  .node{cursor:pointer;}
  .node circle{transition:stroke .12s;}
  .node.dim{opacity:.1;}
  .node.pinned circle{stroke:var(--accent);stroke-width:2.5px;}
  .node.match circle{stroke:var(--accent);stroke-width:2.6px;filter:url(#glow);}
  .node.gsel circle{stroke:#ffffff;stroke-width:2.6px;filter:url(#glow);}
  .node.gdim{opacity:.16;}
  .nlabel.match{fill:var(--accent);font-weight:700;}
  .glink.dim{stroke-opacity:.04 !important;}
  .glink.hot{stroke:var(--accent) !important;stroke-opacity:.95 !important;}
  .nlabel{pointer-events:none;paint-order:stroke;stroke:#161618;stroke-width:3px;stroke-linejoin:round;fill:#c8c9ce;font-weight:500;}
  .hint{position:fixed;bottom:18px;right:26px;z-index:5;font-size:11px;color:#6b6c72;pointer-events:none;}

  a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}
  @media (max-width:560px){ .detail{width:100%;} .controls{width:auto;left:12px;right:12px;} #search{width:140px;} .topbar{display:none;} }
  @media (prefers-reduced-motion: reduce){ *{transition-duration:.01ms !important;} }
</style>
</head>
<body>
  <svg id="graph"></svg>

  <div class="topbar">
    <h1><span class="accent">Data Science</span> · Knowledge Graph</h1>
    <p id="topdesc">An Obsidian-style web of every note. Node size reflects how connected a topic is. Hover to spotlight neighbours, drag to rearrange, click for notes.</p>
  </div>

  <div class="searchwrap"><input id="search" placeholder="Search notes…" autocomplete="off" aria-label="Search topics"><span id="search-count"></span><button id="search-clear" type="button" aria-label="Clear search">✕</button><div id="search-results" role="listbox"></div></div>

  <div class="controls" id="controls">
    <button class="sechead" id="settings-head" type="button" aria-expanded="true" aria-controls="settings-body">
      <span class="caret" aria-hidden="true">▾</span><span>Graph settings</span>
    </button>
    <div class="secbody" id="settings-body">
      <div class="ctrl-row"><label for="c-force">Repel</label><input id="c-force" type="range" min="200" max="1400" value="1400"><span class="ctrl-val" id="v-force"></span></div>
      <div class="ctrl-row"><label for="c-link">Link distance</label><input id="c-link" type="range" min="20" max="160" value="160"><span class="ctrl-val" id="v-link"></span></div>
      <div class="ctrl-row"><label for="c-cluster">Cluster pull</label><input id="c-cluster" type="range" min="0" max="100" value="0"><span class="ctrl-val" id="v-cluster"></span></div>
      <div class="ctrl-row"><label for="c-label">Label density</label><input id="c-label" type="range" min="0" max="100" value="45"><span class="ctrl-val" id="v-label"></span></div>
      <div class="ctrl-row"><label for="c-size">Node size</label><input id="c-size" type="range" min="50" max="200" value="100"><span class="ctrl-val" id="v-size"></span></div>
      <div class="ctrl-row"><label for="c-linkop">Link opacity</label><input id="c-linkop" type="range" min="10" max="200" value="100"><span class="ctrl-val" id="v-linkop"></span></div>
      <div class="ctrl-row"><label for="c-depth">Show down to</label>
        <select id="c-depth">
          <option value="1">domains</option>
          <option value="2">topics</option>
          <option value="3" selected>sub-topics</option>
        </select></div>
      <div class="ctrl-row"><label for="c-arrows">Show is-a arrows</label><input id="c-arrows" type="checkbox" checked></div>
      <div class="ctrl-row"><label for="c-colorlinks">Colour cluster links</label><input id="c-colorlinks" type="checkbox" checked></div>
      <div class="ctrl-row"><label for="c-stubs">Fade notes-less nodes</label><input id="c-stubs" type="checkbox"></div>
      <div class="ctrl-row"><label for="c-freeze">Freeze layout</label><input id="c-freeze" type="checkbox"></div>
      <div class="ctrl-row" style="justify-content:flex-start;gap:8px">
        <button id="c-refit" class="minibtn" type="button">Re-fit view</button>
        <button id="c-reset" class="minibtn" type="button">Reset settings</button>
      </div>
    </div>

    <div class="legsec">
      <button class="sechead" id="legend-head" type="button" aria-expanded="true" aria-controls="legend-body">
        <span class="caret" aria-hidden="true">▾</span><span>Domains</span><span class="tally" id="leg-tally"></span>
      </button>
      <div class="secbody" id="legend-body">
        <div class="legtoggle" id="legtoggle"></div>
        <button id="leg-clear" type="button">✕ clear highlight</button>
      </div>
    </div>
  </div>

  <div class="detail" id="detail">
    <span class="back" id="detail-back" title="Back to previous note" role="button" aria-label="Back to previous note">←</span>
    <span class="close" id="detail-close">×</span>
    <div class="kicker" id="d-kicker"></div>
    <h2 id="d-title"></h2>
    <p class="desc" id="d-desc"></p>
    <div id="d-link"></div>
    <div class="conn-title">Linked notes</div>
    <div class="chips" id="d-chips"></div>
  </div>

  <div class="hint">scroll = zoom · drag = pan · drag a node to move it</div>

<script src="data.js"></script>
<script src="graph.js"></script>
</body>
</html>
